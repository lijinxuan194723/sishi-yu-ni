name: Build Android 1.9.0 Stable

on:
  push:
    branches:
      - 'feat/memo-notes'
    paths:
      - '.github/workflows/build-stable-1.9.0.yml'

permissions:
  contents: read
  actions: read

jobs:
  build-stable-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0' >/dev/null

      - name: Restore continuity signing key
        id: signing-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/luke-preview.p12
          key: luke-preview-signing-v1

      - name: Require existing v12 signing key
        if: steps.signing-cache.outputs.cache-hit != 'true'
        run: |
          echo 'The continuity signing key was not restored. Refusing to create a new key because that would break in-place upgrades and risk user data.' >&2
          exit 1

      - name: Build mobile web bundle
        run: npx vite build --config mobile/vite.config.mts

      - name: Download v12 APK for upgrade verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v12"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10147423176/zip" > "$RUNNER_TEMP/v12.zip"
          unzip -q "$RUNNER_TEMP/v12.zip" -d "$RUNNER_TEMP/v12"
          test -f "$RUNNER_TEMP/v12/Four-Seasons-Luke-Memo-Preview.apk"

      - name: Build signed stable APK
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          STAGE="$RUNNER_TEMP/luke-stable-apk"
          OUTPUT="$GITHUB_WORKSPACE/outputs/android"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/assets/web" "$STAGE/classes" "$STAGE/dex" "$STAGE/native" "$OUTPUT"
          cp -R work/mobile-web/. "$STAGE/assets/web/"
          cp mobile/android/MainActivity.java "$STAGE/native/MainActivity.java"
          cp -R mobile/android/res "$STAGE/native/res"
          cp mobile/android/AndroidManifest.xml "$STAGE/native/AndroidManifest.xml"

          # 1.9.0 promotes the recent v12 installation identity to the stable channel so
          # current test users can update in place without uninstalling or losing local data.
          sed -i \
            -e 's/package="com.luke.summer"/package="com.luke.summer.preview"/' \
            -e 's/android:name="\.MainActivity"/android:name="com.luke.summer.MainActivity"/' \
            -e 's/android:label="四时与你·测试"/android:label="四时与你"/' \
            -e 's/android:versionCode="[0-9]*"/android:versionCode="901000"/' \
            -e 's/android:versionName="[^"]*"/android:versionName="1.9.0"/' \
            "$STAGE/native/AndroidManifest.xml"

          javac -encoding UTF-8 --release 8 \
            -classpath "$ANDROID_JAR" \
            -d "$STAGE/classes" \
            "$STAGE/native/MainActivity.java"

          mapfile -d '' CLASSES < <(find "$STAGE/classes" -name '*.class' -print0)
          "$BUILD_TOOLS/d8" --lib "$ANDROID_JAR" --min-api 26 --output "$STAGE/dex" "${CLASSES[@]}"

          "$BUILD_TOOLS/aapt" package -f \
            -M "$STAGE/native/AndroidManifest.xml" \
            -S "$STAGE/native/res" \
            -A "$STAGE/assets" \
            -I "$ANDROID_JAR" \
            -F "$STAGE/unsigned.apk"

          (
            cd "$STAGE/dex"
            "$BUILD_TOOLS/aapt" add "$STAGE/unsigned.apk" classes.dex
          )

          "$BUILD_TOOLS/zipalign" -f -p 4 "$STAGE/unsigned.apk" "$STAGE/aligned.apk"
          APK="$OUTPUT/Four-Seasons-Luke-1.9.0.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks ~/.android/luke-preview.p12 \
            --ks-key-alias luke-preview \
            --ks-pass pass:android-preview \
            --key-pass pass:android-preview \
            --out "$APK" \
            "$STAGE/aligned.apk"

          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -E 'package:|sdkVersion|targetSdkVersion|application-label:|launchable-activity'
          sha256sum "$APK" | tee "$OUTPUT/Four-Seasons-Luke-1.9.0.sha256"

      - name: Verify v12 can update in place without data loss
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          OLD="$RUNNER_TEMP/v12/Four-Seasons-Luke-Memo-Preview.apk"
          NEW="$GITHUB_WORKSPACE/outputs/android/Four-Seasons-Luke-1.9.0.apk"

          OLD_CERT=$("$BUILD_TOOLS/apksigner" verify --print-certs "$OLD" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)
          NEW_CERT=$("$BUILD_TOOLS/apksigner" verify --print-certs "$NEW" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)

          OLD_BADGING=$("$BUILD_TOOLS/aapt" dump badging "$OLD" | head -1)
          NEW_BADGING=$("$BUILD_TOOLS/aapt" dump badging "$NEW" | head -1)
          OLD_PACKAGE=$(printf '%s\n' "$OLD_BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          NEW_PACKAGE=$(printf '%s\n' "$NEW_BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          OLD_CODE=$(printf '%s\n' "$OLD_BADGING" | sed -n "s/^package: name='[^']*' versionCode='\([0-9]*\)'.*/\1/p")
          NEW_CODE=$(printf '%s\n' "$NEW_BADGING" | sed -n "s/^package: name='[^']*' versionCode='\([0-9]*\)'.*/\1/p")

          echo "oldPackage=$OLD_PACKAGE"
          echo "newPackage=$NEW_PACKAGE"
          echo "oldVersionCode=$OLD_CODE"
          echo "newVersionCode=$NEW_CODE"
          echo "oldSignerSha256=$OLD_CERT"
          echo "newSignerSha256=$NEW_CERT"

          test -n "$OLD_CERT"
          test -n "$NEW_CERT"
          test "$OLD_CERT" = "$NEW_CERT"
          test "$OLD_PACKAGE" = 'com.luke.summer.preview'
          test "$NEW_PACKAGE" = "$OLD_PACKAGE"
          test -n "$OLD_CODE"
          test -n "$NEW_CODE"
          test "$NEW_CODE" -gt "$OLD_CODE"
          "$BUILD_TOOLS/aapt" dump badging "$NEW" | grep -Fq "application-label:'四时与你'"

          echo "Upgrade continuity verified: same package, same signer, higher versionCode."

      - name: Upload stable APK
        uses: actions/upload-artifact@v4
        with:
          name: Four-Seasons-Luke-Stable-1.9.0
          path: |
            outputs/android/Four-Seasons-Luke-1.9.0.apk
            outputs/android/Four-Seasons-Luke-1.9.0.sha256
            docs/releases/android-1.9.0.md
          if-no-files-found: error
          retention-days: 30
