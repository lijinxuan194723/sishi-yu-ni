name: Check Luke Memory V2

on:
  push:
    branches:
      - feat/luke-agent-memory-zh-v2
    paths:
      - 'data/luke/**'
      - 'lib/luke-knowledge.ts'
      - 'lib/luke-memory-v2.ts'
      - 'scripts/checks/check-luke-memory-v2.mjs'
      - '.github/workflows/luke-memory-v2-check.yml'
  pull_request:
    paths:
      - 'data/luke/**'
      - 'lib/luke-knowledge.ts'
      - 'lib/luke-memory-v2.ts'
      - 'scripts/checks/check-luke-memory-v2.mjs'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Luke Memory V2
        run: node --experimental-strip-types scripts/checks/check-luke-memory-v2.mjs
