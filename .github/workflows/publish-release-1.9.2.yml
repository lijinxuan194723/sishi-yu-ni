name: Publish Android 1.9.2 Release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-release-1.9.2.yml'

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish 1.9.2 as latest release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: android-four-seasons-v1.9.2
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title '四时与你 1.9.2（Android）' \
              --notes-file docs/releases/android-1.9.2.md \
              --latest
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title '四时与你 1.9.2（Android）' \
              --notes-file docs/releases/android-1.9.2.md \
              --latest
          fi
