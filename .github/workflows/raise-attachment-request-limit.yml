name: Raise attachment request limit

on:
  push:
    branches:
      - 'feat/memo-notes'
    paths:
      - '.github/workflows/raise-attachment-request-limit.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/memo-notes
          fetch-depth: 0
      - name: Patch Android bridge request limit
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('mobile/android/MainActivity.java')
          s=p.read_text(encoding='utf-8')
          old='body.length()>250000'
          new='body.length()>600000'
          assert old in s
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          git rm .github/workflows/raise-attachment-request-limit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/android/MainActivity.java
          git commit -m "fix: allow bounded chat attachment payloads"
          git push origin HEAD:feat/memo-notes
