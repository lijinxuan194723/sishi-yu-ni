name: Apply chat attachment integration

on:
  push:
    branches:
      - 'feat/memo-notes'
    paths:
      - '.github/workflows/apply-chat-attachments.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/memo-notes
          fetch-depth: 0

      - name: Patch chat composer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/page.tsx')
          s=p.read_text(encoding='utf-8')

          old="import { ConnectionForm, WeatherCard, useConnections, useWeather } from '@/components/connections';"
          new=old+"\nimport {ChatAttachmentPicker,attachmentChatContent,storedChatText,useChatAttachments} from '@/components/chat-attachments';"
          assert old in s and "useChatAttachments" not in s
          s=s.replace(old,new,1)

          old=" const [busy,setBusy]=useState(false),[chatError,setChatError]=useState(''),[settingsTab,setSettingsTab]=useState('general'),[query,setQuery]=useState('');"
          new=old+"\n const attachmentTools=useChatAttachments(setChatError);"
          assert old in s
          s=s.replace(old,new,1)

          old="  if(!ready||sending.current)return;const text=message.trim();if(!retryLast&&!text)return;if(!navigator.onLine){setChatError('网络已断开，输入已保留。联网后再发送。');return;}"
          new="  if(!ready||sending.current)return;const text=message.trim();if(!retryLast&&!text&&!attachmentTools.items.length)return;if(!navigator.onLine){setChatError('网络已断开，输入已保留。联网后再发送。');return;}"
          assert old in s
          s=s.replace(old,new,1)

          old="  const messages=retryLast?data.messages:[...data.messages,{who:'me',text,at:new Date().toISOString()}];if(retryLast&&messages.at(-1)?.who!=='me'&&!messages.at(-1)?.interrupted)return;"
          new="  const outgoingText=storedChatText(text,attachmentTools.items);const messages=retryLast?data.messages:[...data.messages,{who:'me',text:outgoingText,at:new Date().toISOString()}];if(retryLast&&messages.at(-1)?.who!=='me'&&!messages.at(-1)?.interrupted)return;"
          assert old in s
          s=s.replace(old,new,1)

          old="const replyContext=chatContext({...liveContext.current.data,messages,memory:{...memory,pinned:(liveContext.current.data.memory??emptyMemory).pinned}},liveContext.current.weather.weather&&isFresh(liveContext.current.weather.weather)&&!liveContext.current.weather.error?liveContext.current.weather.context:'');if(retryLast&&messages.at(-1)?.interrupted)replyContext.push({role:'user',content:'上一条回复中途断开了，请接着尚未说完的内容继续，不要重复已经收到的部分。'});"
          new="const replyContext=chatContext({...liveContext.current.data,messages,memory:{...memory,pinned:(liveContext.current.data.memory??emptyMemory).pinned}},liveContext.current.weather.weather&&isFresh(liveContext.current.weather.weather)&&!liveContext.current.weather.error?liveContext.current.weather.context:'');if(attachmentTools.items.length&&(!retryLast||messages.at(-1)?.who==='me'))replyContext[replyContext.length-1].content=attachmentChatContent(retryLast?(messages.at(-1)?.text??''):text,attachmentTools.items);if(retryLast&&messages.at(-1)?.interrupted)replyContext.push({role:'user',content:'上一条回复中途断开了，请接着尚未说完的内容继续，不要重复已经收到的部分。'});"
          assert old in s
          s=s.replace(old,new,1)

          old="save(current=>({messages:[...current.messages,{who:'luke',text:reply,source:'model',at:new Date().toISOString()}]}));}"
          new="save(current=>({messages:[...current.messages,{who:'luke',text:reply,source:'model',at:new Date().toISOString()}]}));attachmentTools.clear();}"
          assert old in s
          s=s.replace(old,new,1)

          old='<form onSubmit={e=>{e.preventDefault();send();}} className="composer"><textarea rows={1}'
          new='<form onSubmit={e=>{e.preventDefault();send();}} className="composer"><ChatAttachmentPicker items={attachmentTools.items} loading={attachmentTools.loading} onAdd={attachmentTools.add} onRemove={attachmentTools.remove} disabled={busy}/><textarea rows={1}'
          assert old in s
          s=s.replace(old,new,1)

          old='<button className="primary" disabled={!ready||!message.trim()} aria-label="发送消息"><Send size={20}/></button>'
          new='<button className="primary" disabled={!ready||(!message.trim()&&!attachmentTools.items.length)} aria-label="发送消息"><Send size={20}/></button>'
          assert old in s
          s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
          PY

          git rm .github/workflows/apply-chat-attachments.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          git commit -m "feat: add image and file attachments to chat"
          git push origin HEAD:feat/memo-notes
